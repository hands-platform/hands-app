map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

map $http_x_forwarded_proto $proxy_forwarded_proto {
  default $http_x_forwarded_proto;
  '' $scheme;
}

upstream massage_api {
  server api:3000;
}

upstream massage_admin_web {
  server admin_web:3000;
}

# Public API and Socket.IO host. Keep Admin Web route handlers off this host.
server {
  listen 80;
  server_name api.hands.vn;
  client_max_body_size 25m;

  location /api/ {
    proxy_pass http://massage_api/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $proxy_forwarded_proto;
  }

  location /socket.io/ {
    proxy_pass http://massage_api/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $proxy_forwarded_proto;
    proxy_read_timeout 75s;
  }

  location / {
    return 404;
  }
}

# Admin Web owns its complete namespace, including Next.js /api/admin/* handlers.
server {
  listen 80;
  server_name admin.hands.vn;
  client_max_body_size 25m;

  location / {
    proxy_pass http://massage_admin_web/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $proxy_forwarded_proto;
  }
}

# The public host currently owns referral redirects only. Other paths go to Admin.
server {
  listen 80;
  server_name hands.vn www.hands.vn;
  client_max_body_size 25m;

  location /r/ {
    proxy_pass http://massage_admin_web/r/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $proxy_forwarded_proto;
  }

  location / {
    return 302 https://admin.hands.vn$request_uri;
  }
}

# Local deployment smoke keeps the original path-based routing contract.
