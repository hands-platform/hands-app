name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

jobs:
  node:
    name: Node, Prisma, API, Admin
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Repository contracts
        run: |
          npm run authority:check
          npm run security:secrets
          npm run security:admin-sensitive
          npm run policy:coverage
          npm run notifications:push-data-contract
          npm run realtime:contract
          npm run mobile:architecture:check
          npm run mobile:visible-copy
          npm run android:signing:check:static
          npm run docker:contract

      - name: Prisma validate
        env:
          DATABASE_URL: postgresql://massage:massage@localhost:5432/massage_vn?schema=public
        run: npx prisma validate --schema apps/api/prisma/schema.prisma

      - name: Prisma migration contract
        run: |
          npm run prisma:migrations:check:test
          npm run prisma:migrations:check

      - name: Prisma generate
        env:
          DATABASE_URL: postgresql://massage:massage@localhost:5432/massage_vn?schema=public
        run: npx prisma generate --schema apps/api/prisma/schema.prisma

      - name: Test API
        run: npm run api:test

      - name: Test Admin Web
        run: npm run test --workspace @massage-vn/admin-web

      - name: Test Public Web
        run: npm run test --workspace @massage-vn/public-web

      - name: Test Admin API read budget contract
        run: npm run admin:api-budget:test

      - name: Typecheck API
        run: npm run typecheck --workspace @massage-vn/api

      - name: Typecheck Admin Web
        run: npm run typecheck --workspace @massage-vn/admin-web

      - name: Typecheck Public Web
        run: npm run typecheck --workspace @massage-vn/public-web

      - name: Lint Public Web
        run: npm run lint --workspace @massage-vn/public-web

      - name: Build API
        run: npm run build --workspace @massage-vn/api

      - name: Build Admin Web
        env:
          ADMIN_API_BASE_URL: http://localhost:3000/api
        run: npm run build --workspace @massage-vn/admin-web

      - name: Build Public Web
        env:
          PUBLIC_API_BASE_URL: http://localhost:3000/api
        run: npm run build --workspace @massage-vn/public-web

      - name: Script syntax checks
        run: |
          node --check infra/scripts/api-smoke.mjs
          node --check infra/scripts/admin-api-read-budget.mjs
          node --check infra/scripts/bootstrap-public-site-structure.mjs
          node --check infra/scripts/check-env.mjs
          node --check infra/scripts/supabase-location-exposure-smoke.mjs
          node --check apps/api/prisma/seed.js

      - name: Supabase security contract
        run: |
          npm run supabase:schema:check
          npm run supabase:location-exposure-smoke:test
          npm run supabase:reachability:test

      - name: External setup report contract
        run: |
          npm run external:check:report:test
          npm run external:check:release:test

      - name: Environment template check
        run: node infra/scripts/check-env.mjs .env.example

  flutter:
    name: Customer and Partner Flutter
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.38.9
          cache: true

      - name: Customer dependencies
        working-directory: apps/customer_app
        run: flutter pub get

      - name: Customer analyze
        working-directory: apps/customer_app
        run: flutter analyze

      - name: Customer tests
        working-directory: apps/customer_app
        run: flutter test

      - name: Partner dependencies
        working-directory: apps/provider_app
        run: flutter pub get

      - name: Partner analyze
        working-directory: apps/provider_app
        run: flutter analyze

      - name: Partner tests
        working-directory: apps/provider_app
        run: flutter test

  lifecycle-smoke:
    name: Migration and paired lifecycle smoke
    needs: node
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: finance_approver_it_ci
          POSTGRES_PASSWORD: massage
          POSTGRES_USER: massage
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U massage -d finance_approver_it_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      ADMIN_ACCESS_TOKEN: ci-admin-access-token
      DATABASE_URL: postgresql://massage:massage@127.0.0.1:5432/hands_integration_ci?schema=hands_integration_ci
      INTEGRATION_DATABASE_ALLOWLIST: hands_integration_ci:hands_integration_ci
      INTEGRATION_REDIS_ALLOWLIST: redis://127.0.0.1:6379
      ADMIN_WEB_API_TOKEN_SECRET: ci-admin-web-api-secret-with-at-least-32-characters
      JWT_ACCESS_SECRET: ci-access-secret-with-at-least-32-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-with-at-least-32-characters
      REDIS_URL: redis://127.0.0.1:6379

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema apps/api/prisma/schema.prisma

      - name: Create disposable lifecycle database
        run: >-
          echo "CREATE DATABASE hands_integration_ci;" |
          npx prisma db execute --stdin
          --url "postgresql://massage:massage@127.0.0.1:5432/finance_approver_it_ci?schema=public"

      - name: Run finance approver governance isolation
        env:
          DATABASE_URL: postgresql://massage:massage@127.0.0.1:5432/finance_approver_it_ci?schema=finance_approver_it_ci
          FINANCE_APPROVER_INTEGRATION_DATABASE_ALLOWLIST: finance_approver_it_ci:finance_approver_it_ci
          RUN_FINANCE_APPROVER_DB_INTEGRATION: '1'
        run: |
          npx prisma migrate deploy --schema apps/api/prisma/schema.prisma
          npm run test --workspace @massage-vn/api -- src/admin/admin-finance-approver-governance.integration.spec.ts

      - name: Apply migration history
        run: npx prisma migrate deploy --schema apps/api/prisma/schema.prisma

      - name: Verify migration status
        run: npx prisma migrate status --schema apps/api/prisma/schema.prisma

      - name: Verify release finance governance on a clean target
        run: npm run security:finance-approvers -- --release

      - name: Build API
        run: npm run build --workspace @massage-vn/api

      - name: Run PostgreSQL concurrency contracts
        env:
          RUN_ADMIN_PUSH_DB_INTEGRATION: '1'
          RUN_BOOKING_DB_INTEGRATION: '1'
          RUN_COMPANY_BANK_ACCOUNT_DB_INTEGRATION: '1'
          RUN_OPERATIONAL_POLICY_DB_INTEGRATION: '1'
        run: >-
          npm run test --workspace @massage-vn/api --
          src/admin/admin-company-bank-account-concurrency.integration.spec.ts
          src/admin/admin-operational-policy-concurrency.integration.spec.ts
          src/bookings/bookings.creation-idempotency.integration.spec.ts
          src/notifications/admin-push-campaign.integration.spec.ts

      - name: Run Customer and Partner paired lifecycle
        run: npm run mobile:paired-e2e

      - name: Run CASH refund and settlement lifecycle
        run: npm run bookings:cash-lifecycle-smoke

      - name: Run payment callback and refund lifecycle
        env:
          MOMO_GATEWAY_ENABLED: 'false'
          PAYMENT_LIFECYCLE_SMOKE_PORT: '3002'
          VNPAY_GATEWAY_ENABLED: 'false'
        run: npm run payments:lifecycle-smoke

      - name: Run provider wallet summary concurrency
        run: npm run finance:provider-wallet-summary-concurrency-smoke

      - name: Run Partner withdrawal and payout lifecycle
        run: npm run finance:provider-withdrawal-smoke

      - name: Run disposable PostgreSQL restore drill
        run: npm run database:restore-smoke

      - name: Run disposable object storage restore drill
        run: npm run storage:restore-smoke
