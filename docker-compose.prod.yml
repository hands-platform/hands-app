services:
  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    env_file:
      - ${HANDS_ENV_FILE:-.env}
    environment:
      API_PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-massage}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for production}@postgres:5432/${POSTGRES_DB:-massage_vn}?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      GOOGLE_APPLICATION_CREDENTIALS: ${FIREBASE_ADMIN_CREDENTIALS_CONTAINER_PATH:-/run/secrets/firebase-admin.json}
    volumes:
      - type: bind
        source: ${FIREBASE_ADMIN_CREDENTIALS_HOST_PATH:-./infra/docker/firebase-admin.placeholder.json}
        target: ${FIREBASE_ADMIN_CREDENTIALS_CONTAINER_PATH:-/run/secrets/firebase-admin.json}
        read_only: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 -O - http://127.0.0.1:3000/api/health/ready | grep -q '\"ok\":true'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  admin_web:
    build:
      context: .
      dockerfile: infra/docker/admin_web.Dockerfile
    env_file:
      - ${HANDS_ENV_FILE:-.env}
    environment:
      ADMIN_API_BASE_URL: http://api:3000/api
      PORT: 3000
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/login"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      api:
        condition: service_healthy
      admin_web:
        condition: service_healthy
    ports:
      - "${HANDS_NGINX_BIND_ADDRESS:-127.0.0.1}:${HANDS_NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-massage_vn}
      POSTGRES_USER: ${POSTGRES_USER:-massage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER for production}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD for production}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER for production}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD for production}
      S3_BUCKET: ${S3_BUCKET:-massage-vn}
    entrypoint:
      [
        "/bin/sh",
        "-c",
        "mc alias set local http://minio:9000 \"$${MINIO_ROOT_USER}\" \"$${MINIO_ROOT_PASSWORD}\" && mc mb --ignore-existing local/\"$${S3_BUCKET}\" && mc anonymous set download local/\"$${S3_BUCKET}\"/public || true",
      ]

volumes:
  postgres_data:
  redis_data:
  minio_data:
